version: "3.9"

networks:
  wc-net:
    driver: bridge

volumes:
  dbdata:

services:

  input-frontend:
    image: irfaanpk/input-frontend:latest
    ports:
      - "5000:5000"
    networks:
      - wc-net
    depends_on:
      - redis

  results-frontend:
    image: irfaanpk/results-frontend:latest
    ports:
      - "5001:5001"
    networks:
      - wc-net
    depends_on:
      - db

  worker:
    image: irfaanpk/worker:latest
    networks:
      - wc-net
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    networks:
      - wc-net

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wc_user
      POSTGRES_PASSWORD: wc_pass
      POSTGRES_DB: wordcounts
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wc-net
